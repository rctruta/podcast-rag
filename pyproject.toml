[project]
name = "podrag"
version = "0.1.0"
description = "Corpus-agnostic podcast RAG with verifiable, playable citations"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Ramona C. Truta"}]
dependencies = [
  "lancedb>=0.34",
  "sentence-transformers>=3.0",
  "pyarrow>=17",
  "a third-party caption library>=1.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
synth = ["litellm>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
