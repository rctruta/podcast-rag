# Labelled calibration set for the refusal gate (F-1).
#
# A threshold without a labelled set is an opinion. This is the set that turns
# the floor into a measurement.
#
# label:
#   answerable   - the corpus demonstrably covers this; the gate SHOULD open.
#   near_miss    - same domain, plausible phrasing, NOT covered by these 99
#                  episodes; the gate SHOULD refuse. This is the bucket that
#                  matters. Far-off-topic questions are easy for any threshold;
#                  the near misses are where a badly-set floor fabricates.
#   off_topic    - unrelated to the corpus entirely; the gate SHOULD refuse.
#                  Kept as a floor-sanity check, not as evidence of quality.
#
# Questions are written from episode titles and show subject matter (see
# `transcripts/shows.json` and the title survey), NOT generated from chunk text.
# Deriving a question from the passage that answers it inflates similarity and
# would make the gate look better calibrated than it is.
#
# Corpus at time of writing: 99 episodes / 7,377 chunks / 9 shows.

